# eval/experiment_config.yaml
# Specification and pre-experiment freeze configuration.
# IMPORTANT: This file must always stay in sync with pipelineguardian/llm_config.py.
# Any model/temperature change requires bumping prompt_version/context_schema_version
# and re-tagging experiment-frozen before more Yang-corpus evaluations.

experiment_status: UNFROZEN (Infrastructure Ready — Awaiting LLM Evaluation Runs)

# Code & Model Configurations (must match pipelineguardian/llm_config.py)
llm_model: qwen/qwen3.8-27b
llm_provider: groq
llm_temperature: 0
llm_runs_per_notebook: 3
prompt_version: v1
context_schema_version: v1
random_seed: 42

# Corpus & Benchmark Versions
yang_corpus_version: v1.0 (PREPROCESSING, OVERLAP, MULTI_TEST)
synthetic_fixtures_version: v2.0 (40 diverse fixtures)
reproducibility_benchmark_version: v1.0 (eval/reproducibility_benchmark/ground_truth.json)
validation_benchmark_version: v1.0 (eval/validation_benchmark/ground_truth.json)
real_world_reproducibility_version: v1.0 (eval/real_world_reproducibility/ - pending public collection)

# Git commit hash (Populated when status set to FROZEN)
git_commit_at_freeze: "TBD — populate with `git rev-parse HEAD` when experiment tag applied"
freeze_date: "TBD"

# Pre-Experiment Freeze Checklist (Must be 100% checked before setting status to FROZEN):
# [ ] 1. All unit and detector tests pass cleanly (`python -m pytest tests/ -q`)
# [ ] 2. Issue schema category and source fields non-optional and verified across all 4 architectures
# [ ] 3. Synthetic benchmark (40 fixtures) passes without regression
# [ ] 4. Labeling rubrics written and frozen (`eval/rubrics/`)
# [ ] 5. Curated benchmarks frozen (`eval/reproducibility_benchmark/`, `eval/validation_benchmark/`)
# [ ] 6. Real-world reproducibility corpus collected and dual-annotated / blind-labeled
# [ ] 7. Inter-rater / self-agreement computed and documented (`eval/compute_agreement.py`)
# [ ] 8. `git_commit_at_freeze` populated with output of `git rev-parse HEAD`
# [ ] 9. Apply git tag: `git tag -a experiment-frozen -m "PipelineGuardian experiment frozen"`
